    <a routerLink="/history" routerLinkActive="active" title="Activity">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />

  <div class="right-section">
    <div class="user-menu-container">
      <button class="user-link-btn" (click)="toggleUserMenu()">
        <div class="user-avatar"
             [style.borderColor]="healthService.isHealthy() ? '#2b8a3e' : '#c92a2a'"
             [attr.title]="healthService.isHealthy() ? 'App is Online' : 'App is Offline'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="avatar-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
      </button>

      @if (isUserMenuOpen) {
        <div class="dropdown-menu">
          @if (authService.isAuthenticatedSignal()) {
            <button class="dropdown-item" (click)="resetAuth()">Reset</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-btn" (click)="logout()">Logout</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item delete-btn" (click)="deleteAccount()">Delete Account</button>
          } @else {
            <button class="dropdown-item" (click)="reset()">Reset</button>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" routerLink="/login" (click)="closeUserMenu()">Login</a>
            <a class="dropdown-item" routerLink="/register" (click)="closeUserMenu()">Register</a>
          }
        </div>
      }
    </div>
  </div>
