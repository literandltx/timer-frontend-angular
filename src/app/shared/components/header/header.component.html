      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">

  <div class="right-section">
    <div class="user-menu-container">
      <button class="user-link-btn" (click)="toggleUserMenu()"
              [attr.title]="healthService.isHealthy() ? 'App is Online' : 'App is Offline'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="menu-icon"
             [style.color]="healthService.isHealthy() ? '#2b8a3e' : '#c92a2a'">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>

      @if (isUserMenuOpen) {
        <div class="dropdown-menu">
          <a class="dropdown-item" routerLink="/profile" (click)="closeUserMenu()">Profile</a>
          <a class="dropdown-item" routerLink="/settings" (click)="closeUserMenu()">Settings</a>
          <a class="dropdown-item" routerLink="/about" (click)="closeUserMenu()">About</a>

          <div class="dropdown-divider"></div>

          @if (authService.isAuthenticatedSignal()) {
            <button class="dropdown-item logout-btn" (click)="logout()">Logout</button>
          } @else {
            <a class="dropdown-item" routerLink="/login" (click)="closeUserMenu()">Sign In</a>
          }
        </div>
      }
    </div>
  </div>
</nav>

@if (errorMessage) {
  <div class="header-error-toast" role="alert">
    <span>{{ errorMessage }}</span>
    <button type="button" class="error-dismiss-btn" (click)="dismissError()" aria-label="Dismiss">&times;</button>
  </div>
}
