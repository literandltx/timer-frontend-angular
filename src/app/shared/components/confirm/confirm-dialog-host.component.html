@if (dialogService.request(); as req) {
  <div class="confirm-backdrop" (click)="onCancel()">
    <div class="confirm-box" role="alertdialog" aria-modal="true"
         (click)="$event.stopPropagation()">
      <p class="confirm-message">{{ req.message }}</p>
      <div class="confirm-actions">
        <button type="button" class="confirm-btn cancel-btn" (click)="onCancel()">
          {{ req.cancelLabel }}
        </button>
        <button
          type="button"
          class="confirm-btn confirm-action-btn"
          [class.danger]="req.variant === 'danger'"
          (click)="onConfirm()"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
