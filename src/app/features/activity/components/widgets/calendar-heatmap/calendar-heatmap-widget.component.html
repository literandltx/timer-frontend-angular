<div class="widget-container">
  <div class="widget-header">
    <!--    <span class="eyebrow">{{ title }}</span>-->

    <div class="month-row">
      <ns-widget-button icon="prev"
                        ariaLabel="Previous month"
                        buttonTitle="Previous"
                        (buttonClick)="prev()"/>

      <h3 class="month-label">{{ monthLabel() }}</h3>

      <ns-widget-button
        icon="next"
                        ariaLabel="Next month"
                        buttonTitle="Next"
                        (buttonClick)="next()"/>
    </div>

    <span class="total-label">{{ totalCount() }} {{ unitLabel }} this month</span>
  </div>

  <div class="weekday-row">
    @for (wd of weekDays; track $index) {
      <span class="weekday-cell">{{ wd }}</span>
    }
  </div>

  <div class="calendar-grid">
    @for (cell of cells(); track $index) {
      @if (cell === null) {
        <div class="day-cell empty"></div>
      } @else {
        <div class="day-cell"
             [class.level-0]="cell.level === 0"
             [class.level-1]="cell.level === 1"
             [class.level-2]="cell.level === 2"
             [class.level-3]="cell.level === 3"
             [class.level-4]="cell.level === 4"
             [class.today]="cell.isToday"
             [attr.title]="cell.count + ' ' + unitLabel">
          {{ cell.day }}
        </div>
      }
    }
  </div>

  <div class="legend-row">
    <span class="legend-text">Less</span>
    <span class="legend-dot level-0"></span>
    <span class="legend-dot level-1"></span>
    <span class="legend-dot level-2"></span>
    <span class="legend-dot level-3"></span>
    <span class="legend-dot level-4"></span>
    <span class="legend-text">More</span>
  </div>
</div>
