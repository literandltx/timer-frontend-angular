<div
  class="timer-wrapper"
  role="button"
  tabindex="0"
  (click)="onUserClick()"
  (keyup.enter)="handleClick()"
  (keyup.space)="handleClick()"
>
  <div class="ring-container">
    <svg class="ring-svg" viewBox="0 0 300 300">
      <g [attr.transform]="'rotate(-90 ' + center + ' ' + center + ')'">
        <circle
          class="ring-track"
          [attr.cx]="center"
          [attr.cy]="center"
          [attr.r]="radius"
          [attr.stroke-width]="strokeWidth"
          fill="none"/>

        <circle
          class="ring-progress"
          [attr.cx]="center"
          [attr.cy]="center"
          [attr.r]="radius"
          [attr.stroke-width]="strokeWidth"
          fill="none"
          [attr.stroke-dasharray]="circumference"
          [attr.stroke-dashoffset]="dashOffset()"/>
      </g>

      <circle
        class="ring-dot"
        [attr.cx]="dotPosition().x"
        [attr.cy]="dotPosition().y"
        [attr.r]="strokeWidth"/>
    </svg>

    <h1 class="timer-display">
      {{ timerService.formattedTime() }}
    </h1>

    <p class="timer-subtitle">
      @switch (timerService.state()) {
        @case ('idle') {
          Click to Start
        }
        @case ('running') {
          Click to pause • Double-click to Finish
        }
        @case ('paused') {
          Click to resume • Double-click to Finish
        }
      }
    </p>
  </div>
</div>
