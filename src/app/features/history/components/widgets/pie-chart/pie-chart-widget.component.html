<div class="chart-container">
  <div class="chart-header">
    <div class="timeframe-wrapper">
      <ns-app-toggle-group variant="standard">
        <ns-app-toggle-button [active]="timeframe() === 'day'" (toggled)="setTimeframe('day')">Today</ns-app-toggle-button>
        <ns-app-toggle-button [active]="timeframe() === 'week'" (toggled)="setTimeframe('week')">Week</ns-app-toggle-button>
        <ns-app-toggle-button [active]="timeframe() === 'month'" (toggled)="setTimeframe('month')">Month</ns-app-toggle-button>
        <ns-app-toggle-button [active]="timeframe() === 'all'" (toggled)="setTimeframe('all')">All</ns-app-toggle-button>
      </ns-app-toggle-group>
    </div>
  </div>

  <div class="chart-content">
    @if (chartData().hasData) {
      <div class="pie-chart-wrapper">
        <div class="pie-chart" [style.background]="chartData().conicStyle">
          <div class="donut-hole">
            <span class="total-time">{{ chartData().formattedTotal }}</span>
            <span class="total-label">TOTAL</span>
          </div>
        </div>
      </div>

      <div class="chart-legend">
        @for (item of chartData().legend; track item.name) {
          <div class="legend-row">
            <div class="legend-left">
              <span class="color-dot" [style.background-color]="item.color"></span>
              <span class="item-name">{{ item.name }}</span>
            </div>

            <div class="legend-right">
              <span class="item-time">{{ item.formattedTime }}</span>
              <span class="item-badge">{{ item.percentage }}%</span>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="empty-chart">
        <p>No activity logged for this period.</p>
      </div>
    }
  </div>
</div>
