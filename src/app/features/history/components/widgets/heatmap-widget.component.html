<div class="heatmap-container">
  <h3 class="heatmap-title">Heatmap</h3>

  @if (heatmapData().hasData) {
    <div class="heatmap-scroll">
      <div class="heatmap-grid"
           [style.grid-template-columns]="'auto repeat(' + heatmapData().weeks.length + ', 1fr)'">

        <div class="corner-cell"></div>
        @for (label of heatmapData().monthLabels; track $index) {
          <div class="month-label">{{ label }}</div>
        }

        @for (rowIndex of dayRows; track rowIndex) {
          <div class="day-label">{{ dayLabel(rowIndex) }}</div>
          @for (week of heatmapData().weeks; track $index) {
            <div class="heatmap-cell"
                 [class.intensity-1]="week[rowIndex].intensity === 1"
                 [class.intensity-2]="week[rowIndex].intensity === 2"
                 [class.intensity-3]="week[rowIndex].intensity === 3"
                 [class.intensity-4]="week[rowIndex].intensity === 4"
                 [title]="tooltipFor(week[rowIndex])">
            </div>
          }
        }
      </div>
    </div>
  } @else {
    <div class="empty-chart">
      <p>No activity logged yet.</p>
    </div>
  }
</div>
